<title>Reza</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Reza design system.
   Layout: app shell = sidebar (248px, 76px on tablet, bottom tab bar on phones) + main column with sticky topbar.
   Brand = black outline + white ring + pink fill ("ringed" shapes) used on the logo, primary buttons and key chips. */
:root{
  --pink:#FF4FA3; --pink-deep:#F72585; --pink-soft:#FFE1EF; --snow:#FFF9FC; --white:#FFFFFF; --ink:#151015; --gray:#8C858B;
  --bg:#FFF9FC; --surface:#FFFFFF; --surface-2:#FCF2F7; --surface-3:#F7E9F0; --line:#F1E3EB; --line-2:#E6D3DE;
  --text:#151015; --text-2:#4F474D; --muted:#8C858B; --edge:#151015;
  --accent:#F72585; --accent-2:#FF4FA3; --accent-soft:#FFE1EF; --accent-ink:#FFFFFF;
  --dark:#151015; --on-dark:#FFFFFF; --on-dark-2:#B7ADB4; --dark-line:#2D242C;
  --ok:#0E7A57; --ok-soft:#DDF3EA; --warn:#A85A00; --warn-soft:#FFEFD9; --hot:#D11F45; --hot-soft:#FDE1E7;
  --bubble-client:#FFFFFF; --bubble-ai:#151015; --bubble-ai-ink:#FFFFFF;
  --sh-1:0 1px 2px rgba(21,16,21,.05);
  --sh-2:0 1px 2px rgba(21,16,21,.04),0 10px 30px -14px rgba(21,16,21,.16);
  --sh-pink:0 18px 50px -18px rgba(247,37,133,.45);
  --grad:linear-gradient(135deg,#FF4FA3 0%,#F72585 100%);
  --font:"Manrope","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r-xs:8px; --r-sm:12px; --r:18px; --r-lg:26px;
  --side-w:252px; --ease:cubic-bezier(.2,.75,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C080C; --surface:#151015; --surface-2:#1C151C; --surface-3:#251C24; --line:#2A2029; --line-2:#3A2D38;
  --text:#FFF5FA; --text-2:#D3C8CF; --muted:#9A9298; --edge:#FFFFFF;
  --accent:#FF4FA3; --accent-2:#FF7AB8; --accent-soft:#3A1428; --accent-ink:#FFFFFF;
  --dark:#000000; --on-dark:#FFFFFF; --on-dark-2:#B7ADB4; --dark-line:#2D242C;
  --ok:#47C99B; --ok-soft:#10301F; --warn:#F0A64B; --warn-soft:#352310; --hot:#FF6B86; --hot-soft:#3D1420;
  --bubble-client:#1F181F; --bubble-ai:#FFFFFF; --bubble-ai-ink:#151015;
  --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 1px 2px rgba(0,0,0,.4),0 14px 34px -16px rgba(0,0,0,.7);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0C080C; --surface:#151015; --surface-2:#1C151C; --surface-3:#251C24; --line:#2A2029; --line-2:#3A2D38;
  --text:#FFF5FA; --text-2:#D3C8CF; --muted:#9A9298; --edge:#FFFFFF;
  --accent:#FF4FA3; --accent-2:#FF7AB8; --accent-soft:#3A1428; --accent-ink:#FFFFFF;
  --dark:#000000; --on-dark:#FFFFFF; --on-dark-2:#B7ADB4; --dark-line:#2D242C;
  --ok:#47C99B; --ok-soft:#10301F; --warn:#F0A64B; --warn-soft:#352310; --hot:#FF6B86; --hot-soft:#3D1420;
  --bubble-client:#1F181F; --bubble-ai:#FFFFFF; --bubble-ai-ink:#151015;
  --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 1px 2px rgba(0,0,0,.4),0 14px 34px -16px rgba(0,0,0,.7);
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"ss01","cv11"}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--surface)}
h1,h2,h3,h4{margin:0;line-height:1.12;text-wrap:balance;letter-spacing:-.02em}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--mono);font-feature-settings:normal}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.svg.sm{width:15px;height:15px}

/* ---------- motion ---------- */
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(247,37,133,.45)}70%{box-shadow:0 0 0 9px rgba(247,37,133,0)}100%{box-shadow:0 0 0 0 rgba(247,37,133,0)}}
@keyframes shimmer{from{background-position:-200% 0}to{background-position:200% 0}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes dots{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-2px)}}
@keyframes slidein{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes draw{from{stroke-dashoffset:260}to{stroke-dashoffset:0}}
.page>*{animation:rise .55s var(--ease) both;animation-delay:calc(var(--i,0) * 45ms)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* app tint follows the industry */
:root{
  --bg:color-mix(in srgb,var(--ind) 4%,#FFFFFF);
  --surface-2:color-mix(in srgb,var(--ind) 6%,#FFFFFF);
  --surface-3:color-mix(in srgb,var(--ind) 11%,#FFFFFF);
  --line:color-mix(in srgb,var(--ind) 12%,#F1EFF3);
  --line-2:color-mix(in srgb,var(--ind) 22%,#E6E3E9);
  --accent:var(--ind); --accent-2:color-mix(in srgb,var(--ind) 72%,#FFFFFF);
  --accent-soft:color-mix(in srgb,var(--ind) 13%,#FFFFFF);
  --grad:linear-gradient(135deg,color-mix(in srgb,var(--ind) 76%,#FFFFFF) 0%,var(--ind) 100%);
  --sh-pink:0 18px 50px -18px color-mix(in srgb,var(--ind) 55%,transparent);
  --glow:color-mix(in srgb,var(--ind) 62%,transparent);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:color-mix(in srgb,var(--ind) 5%,#0B090C); --surface:color-mix(in srgb,var(--ind) 4%,#141116);
  --surface-2:color-mix(in srgb,var(--ind) 8%,#18151A); --surface-3:color-mix(in srgb,var(--ind) 15%,#1D1A20);
  --line:color-mix(in srgb,var(--ind) 15%,#262229); --line-2:color-mix(in srgb,var(--ind) 25%,#332E36);
  --accent:color-mix(in srgb,var(--ind) 82%,#FFFFFF); --accent-2:color-mix(in srgb,var(--ind) 60%,#FFFFFF);
  --accent-soft:color-mix(in srgb,var(--ind) 24%,#141116);
}}
:root[data-theme="dark"]{
  --bg:color-mix(in srgb,var(--ind) 5%,#0B090C); --surface:color-mix(in srgb,var(--ind) 4%,#141116);
  --surface-2:color-mix(in srgb,var(--ind) 8%,#18151A); --surface-3:color-mix(in srgb,var(--ind) 15%,#1D1A20);
  --line:color-mix(in srgb,var(--ind) 15%,#262229); --line-2:color-mix(in srgb,var(--ind) 25%,#332E36);
  --accent:color-mix(in srgb,var(--ind) 82%,#FFFFFF); --accent-2:color-mix(in srgb,var(--ind) 60%,#FFFFFF);
  --accent-soft:color-mix(in srgb,var(--ind) 24%,#141116);
}
body{transition:background-color .4s var(--ease)}
.dark-card::before{background:radial-gradient(closest-side,var(--glow),color-mix(in srgb,var(--ind) 15%,transparent) 55%,transparent)!important}
.ai-card::before{background:radial-gradient(closest-side,var(--glow),transparent)!important}
.orb{background:var(--grad)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ind) 45%,transparent)}70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.orb-lg{background:conic-gradient(from 0deg,var(--accent-2),var(--ind),var(--accent-soft),var(--accent-2))}
.orb-lg::after{box-shadow:inset 0 0 12px var(--glow)}
.safe-band li .svg{color:var(--accent-2)}

/* ---------- logo ---------- */
.logo{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.04em}
.logo svg{flex:none}
.wordmark{display:inline-flex;align-items:baseline}
.wordmark i{font-style:normal;color:var(--accent)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:12px;font-weight:700;font-size:14px;border:1px solid var(--line-2);background:var(--surface);color:var(--text);transition:transform .15s var(--ease),box-shadow .2s var(--ease),border-color .2s,background .2s;white-space:nowrap;user-select:none}
.btn:hover{border-color:var(--text-2);transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--grad);color:#fff;border:1.5px solid var(--edge);box-shadow:0 3px 0 var(--edge)}
.btn-primary:hover{border-color:var(--edge);box-shadow:0 4px 0 var(--edge),var(--sh-pink)}
.btn-primary:active{transform:translateY(3px);box-shadow:0 0 0 var(--edge)}
.btn-dark{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn-dark:hover{border-color:var(--text)}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:var(--surface-2);border-color:transparent}
.btn-sm{height:32px;padding:0 12px;font-size:13px;border-radius:10px}
.btn-lg{height:50px;padding:0 22px;font-size:15.5px;border-radius:14px}
.btn:disabled{opacity:.45;pointer-events:none}
.icon-btn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:var(--text-2);position:relative;transition:background .2s,color .2s}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.dot-count{position:absolute;top:5px;right:5px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--accent);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;border:2px solid var(--surface);animation:pop .4s var(--ease)}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-1)}
.card-pad{padding:20px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-h h3{font-size:15.5px;font-weight:800}
.card-h .link{font-size:13px;font-weight:700;color:var(--muted)}
.card-h .link:hover{color:var(--accent)}
.lift{transition:transform .25s var(--ease),box-shadow .25s var(--ease),border-color .25s}
.lift:hover{transform:translateY(-3px);box-shadow:var(--sh-2);border-color:var(--line-2)}
.dark-card{background:var(--dark);color:var(--on-dark);border:1px solid var(--dark-line);border-radius:var(--r-lg);position:relative;overflow:hidden;isolation:isolate}
.dark-card::before{content:"";position:absolute;width:520px;height:520px;right:-180px;top:-260px;background:radial-gradient(closest-side,rgba(255,79,163,.55),rgba(247,37,133,.15) 55%,transparent);z-index:-1}
.dark-card::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1px);background-size:18px 18px;mask-image:linear-gradient(90deg,transparent,#000 70%);z-index:-1}
.eyebrow{font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}

/* ---------- pills, tags, avatars ---------- */
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--surface-2);color:var(--text-2)}
.pill .d{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ai{background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.hot{background:var(--hot-soft);color:var(--hot)}
.pill.ink{background:var(--text);color:var(--bg)}
.pill.line{background:transparent;border:1px solid var(--line-2)}
.ch{display:inline-grid;place-items:center;height:18px;padding:0 5px;border-radius:5px;font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.04em;background:var(--surface-3);color:var(--text-2)}
.avatar{--h:330;width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;background:linear-gradient(140deg,hsl(var(--h) 70% 62%),hsl(calc(var(--h) + 30) 65% 44%));position:relative}
.avatar.sm{width:30px;height:30px;font-size:12px}
.avatar.lg{width:64px;height:64px;font-size:24px}
.avatar.ink{background:var(--text);color:var(--bg)}
.avatar .on{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:var(--ok);border:2px solid var(--surface)}

/* AI orb: the product's living indicator */
.orb{width:10px;height:10px;border-radius:50%;background:var(--grad);flex:none;animation:pulse 2.2s infinite}
.orb.off{background:var(--muted);animation:none}
.orb-lg{width:36px;height:36px;border-radius:50%;position:relative;flex:none;background:conic-gradient(from 0deg,#FF4FA3,#F72585,#FFE1EF,#FF4FA3);animation:spin 4s linear infinite}
.orb-lg::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--dark);box-shadow:inset 0 0 12px rgba(255,79,163,.6)}
.orb-lg.paused{animation:none;background:var(--line-2)}

/* ---------- forms ---------- */
.field{display:grid;gap:6px}
.field>span{font-size:12.5px;font-weight:700;color:var(--text-2)}
.input,.textarea,.select{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:12px;padding:10px 13px;transition:border-color .2s,box-shadow .2s;outline:none}
.input:focus,.textarea:focus,.select:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.textarea{resize:vertical;min-height:110px;line-height:1.5}
.switch{position:relative;width:42px;height:24px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch i{position:absolute;inset:0;border-radius:999px;background:var(--line-2);transition:background .25s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .3s var(--ease)}
.switch input:checked+i{background:var(--accent)}
.switch input:checked+i::after{transform:translateX(18px)}
.switch input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
.seg{display:inline-flex;padding:4px;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px}
.seg button{height:32px;padding:0 12px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted);transition:background .2s,color .2s}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--sh-1)}
.row-set{display:flex;align-items:center;gap:14px;justify-content:space-between;padding:14px 0;border-top:1px solid var(--line)}
.row-set:first-child{border-top:0;padding-top:2px}
.row-set b{font-weight:700;display:block}
.row-set small{color:var(--muted);font-size:13px}

/* ---------- app shell ---------- */
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100dvh;padding:18px 14px 14px;display:flex;flex-direction:column;gap:14px;border-right:1px solid var(--line);background:var(--surface);padding-left:max(14px,env(safe-area-inset-left,0px))}
.side .logo{padding:4px 8px 6px}
.ws{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2);text-align:left;transition:border-color .2s}
.ws:hover{border-color:var(--line-2)}
.ws div{min-width:0;flex:1}
.ws b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:grid;gap:2px;overflow-y:auto;margin-inline:-4px;padding-inline:4px}
.nav h6{margin:12px 10px 6px;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.nav a{display:flex;align-items:center;gap:11px;height:38px;padding:0 10px;border-radius:11px;text-decoration:none;font-weight:650;font-size:14px;color:var(--text-2);position:relative;transition:background .2s,color .2s}
.nav a:hover{background:var(--surface-2);color:var(--text)}
.nav a[aria-current="page"]{background:var(--text);color:var(--bg)}
.nav a[aria-current="page"] .svg{color:var(--accent-2)}
.nav a .cnt{margin-left:auto;font-size:11px;font-weight:800;min-width:20px;height:20px;padding:0 6px;border-radius:10px;display:grid;place-items:center;background:var(--accent);color:#fff}
.side-foot{margin-top:auto;display:grid;gap:10px}
.ai-card{border-radius:16px;padding:14px;background:var(--dark);color:var(--on-dark);display:grid;gap:10px;position:relative;overflow:hidden;isolation:isolate}
.ai-card::before{content:"";position:absolute;width:200px;height:200px;right:-90px;top:-110px;background:radial-gradient(closest-side,rgba(255,79,163,.55),transparent);z-index:-1}
.ai-card .top{display:flex;align-items:center;gap:10px}
.ai-card b{font-size:13.5px;display:block}
.ai-card small{font-size:12px;color:var(--on-dark-2)}
.ai-card .btn{height:30px;font-size:12.5px;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);color:#fff}
.me{display:flex;align-items:center;gap:10px;padding:8px;border-radius:12px;text-align:left;transition:background .2s}
.me:hover{background:var(--surface-2)}
.me div{min-width:0}
.me b{display:block;font-size:13.5px}
.me small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:12px;padding-block:12px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px));background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent}
.topbar.scrolled{border-bottom-color:var(--line)}
.crumb{display:flex;align-items:center;gap:8px;min-width:0;margin-right:auto}
.crumb small{color:var(--muted);font-weight:600;white-space:nowrap}
.crumb b{font-size:15px;white-space:nowrap}
.search{display:flex;align-items:center;gap:9px;height:38px;width:min(320px,30vw);padding:0 10px 0 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--muted);font-size:13.5px;transition:border-color .2s}
.search:hover{border-color:var(--line-2)}
.search kbd{margin-left:auto;font-family:var(--mono);font-size:11px;padding:2px 6px;border-radius:6px;border:1px solid var(--line-2);color:var(--text-2)}
.content{padding:8px 28px 48px;padding-right:max(28px,env(safe-area-inset-right,0px));flex:1;min-width:0}
.page{display:grid;gap:20px;max-width:1360px;margin:0 auto;width:100%;grid-template-columns:minmax(0,1fr)}
.page>*{min-width:0}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-top:8px}
.page-h h1{font-size:clamp(26px,2.6vw,34px);font-weight:800;letter-spacing:-.035em}
.page-h p{color:var(--muted);margin-top:4px}
.page-h .acts{display:flex;gap:8px;flex-wrap:wrap}

/* mobile chrome */
.mtop,.tabbar{display:none}

/* ---------- dashboard ---------- */
.dash-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.span-8{grid-column:span 8}.span-4{grid-column:span 4}.span-6{grid-column:span 6}.span-5{grid-column:span 5}.span-7{grid-column:span 7}.span-12{grid-column:span 12}
.hero-ai{padding:26px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:24px;min-height:250px}
.hero-ai .big{font-size:clamp(52px,6vw,76px);font-weight:800;letter-spacing:-.05em;line-height:.95;margin-top:14px}
.hero-ai .big small{font-size:18px;letter-spacing:-.01em;color:var(--on-dark-2);font-weight:600;margin-left:8px}
.hero-ai p.sub{color:var(--on-dark-2);margin-top:8px;max-width:34ch}
.hero-ai .mini-stats{display:flex;gap:22px;margin-top:22px;flex-wrap:wrap}
.hero-ai .mini-stats div{display:grid;gap:2px}
.hero-ai .mini-stats span{font-size:12px;color:var(--on-dark-2)}
.hero-ai .mini-stats b{font-size:20px;font-weight:800}
.hero-ai .status{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px 0 10px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);font-size:12.5px;font-weight:700}
.spark{align-self:stretch;display:flex;flex-direction:column;justify-content:flex-end;min-width:0}
.spark svg{width:100%;height:auto;overflow:visible}
.spark .lbl{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--on-dark-2);margin-top:6px}
.kpi{padding:18px;display:grid;gap:10px;align-content:start;position:relative;overflow:hidden}
.kpi .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--surface-2);color:var(--text)}
.kpi.accent .ic{background:var(--grad);color:#fff;border:1.5px solid var(--edge);box-shadow:0 2px 0 var(--edge)}
.kpi .lab{font-size:13px;color:var(--muted);font-weight:650}
.kpi .val{font-size:34px;font-weight:800;letter-spacing:-.04em;line-height:1}
.kpi .delta{font-size:12.5px;font-weight:700;color:var(--ok)}
.kpi .delta span{color:var(--muted);font-weight:600}
.kpi-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.ring-wrap{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font-size:30px;font-weight:800;letter-spacing:-.04em;display:block;line-height:1}
.ring .c small{font-size:11.5px;color:var(--muted);font-weight:700}
.bars-list{display:grid;gap:12px}
.bl{display:grid;gap:5px}
.bl .t{display:flex;justify-content:space-between;font-size:13px;font-weight:650}
.bl .t span:last-child{font-variant-numeric:tabular-nums;color:var(--text-2)}
.bl .track{height:8px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.bl .track i{display:block;height:100%;border-radius:4px;background:var(--accent);transform-origin:left;animation:grow .9s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.feed{list-style:none;margin:0;padding:0;display:grid}
.feed li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.feed li:first-child{border-top:0;padding-top:0}
.feed .fi{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);color:var(--text-2)}
.feed .fi.book{background:var(--ok-soft);color:var(--ok)}
.feed .fi.mute{background:var(--accent-soft);color:var(--accent)}
.feed .fi.handoff{background:var(--warn-soft);color:var(--warn)}
.feed .fi.req{background:var(--hot-soft);color:var(--hot)}
.feed p{font-size:13.5px;line-height:1.45}
.feed time{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.qa{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.qa button{display:grid;gap:10px;align-content:start;text-align:left;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface);transition:transform .2s var(--ease),border-color .2s,box-shadow .2s}
.qa button:hover{transform:translateY(-2px);border-color:var(--text);box-shadow:0 3px 0 var(--text)}
.qa .svg{color:var(--accent)}
.qa b{font-size:13.5px;line-height:1.3}
.up-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.up-row:first-child{border-top:0;padding-top:0}
.datebox{width:46px;height:50px;border-radius:12px;border:1px solid var(--line-2);display:grid;place-items:center;align-content:center;line-height:1.05}
.datebox small{font-family:var(--mono);font-size:10px;text-transform:uppercase;color:var(--accent);font-weight:600}
.datebox b{font-size:18px;font-weight:800}
.up-row strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up-row>div>span{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.up-row>div>strong>span{display:inline}
@media (min-width:821px){.app{background:linear-gradient(to right,var(--surface) calc(var(--side-w) - 1px),var(--line) calc(var(--side-w) - 1px),var(--line) var(--side-w),transparent var(--side-w))}}

/* ---------- inbox ---------- */
.inbox{display:grid;grid-template-columns:330px minmax(0,1fr) 300px;height:calc(100dvh - 92px);min-height:540px;border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;background:var(--surface);box-shadow:var(--sh-1)}
.ib-list{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.ib-list .hd{padding:16px 16px 10px;display:grid;gap:10px}
.ib-list .hd h2{font-size:19px;font-weight:800}
.ib-search{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border-radius:11px;background:var(--surface-2);border:1px solid transparent;color:var(--muted)}
.ib-search:focus-within{border-color:var(--accent);background:var(--surface)}
.ib-search input{border:0;background:none;outline:none;flex:1;min-width:0;color:var(--text)}
.ib-filters{display:flex;gap:6px;overflow-x:auto}
.ib-filters button{height:28px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:700;border:1px solid var(--line);color:var(--text-2);white-space:nowrap}
.ib-filters button[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.convos{overflow-y:auto;padding:4px 8px 12px;display:grid;gap:2px;align-content:start}
.cv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:11px;padding:11px 10px;border-radius:14px;text-align:left;position:relative;transition:background .2s}
.cv:hover{background:var(--surface-2)}
.cv[aria-current="true"]{background:var(--accent-soft)}
.cv .l1{display:flex;align-items:center;gap:6px;min-width:0}
.cv .l1 b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cv .l1 time{margin-left:auto;font-size:11.5px;color:var(--muted);flex:none}
.cv .l2{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.cv .l3{display:flex;gap:6px;margin-top:6px;align-items:center}
.cv.unread .l2{color:var(--text);font-weight:650}
.cv.unread::after{content:"";position:absolute;right:12px;bottom:16px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.cv .pin{font-family:var(--mono);font-size:9.5px;font-weight:600;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}

.thread{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.th-head{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.th-head .who{min-width:0;flex:1}
.th-head .who b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.th-head .who span{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.th-head .back{display:none}
.banner{display:flex;align-items:center;gap:10px;padding:9px 16px;font-size:13px;font-weight:650;border-bottom:1px solid var(--line)}
.banner.ai{background:linear-gradient(90deg,var(--accent-soft),transparent);color:var(--text)}
.banner.human{background:var(--warn-soft);color:var(--warn)}
.banner.personal{background:var(--surface-2);color:var(--text-2)}
.msgs{flex:1;overflow-y:auto;padding:20px clamp(14px,3vw,32px);display:flex;flex-direction:column;gap:4px;min-height:0}
.daychip{align-self:center;font-family:var(--mono);font-size:11px;color:var(--muted);padding:3px 10px;border-radius:999px;border:1px solid var(--line);margin:4px 0 10px;background:var(--surface)}
.m{max-width:min(78%,520px);display:grid;gap:3px;animation:slidein .35s var(--ease) both}
.m .bub{padding:10px 13px;border-radius:18px;font-size:14.5px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.m .meta{font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:center;padding-inline:6px}
.m.client{align-self:flex-start}
.m.client .bub{background:var(--bubble-client);border:1px solid var(--line);border-bottom-left-radius:6px}
.m.bot,.m.owner{align-self:flex-end}
.m.bot .meta,.m.owner .meta{justify-content:flex-end}
.m.bot .bub{background:var(--bubble-ai);color:var(--bubble-ai-ink);border-bottom-right-radius:6px}
.m.owner .bub{background:var(--grad);color:#fff;border-bottom-right-radius:6px}
.m .who-tag{font-weight:800;color:var(--text-2)}
.m.bot .who-tag{display:inline-flex;align-items:center;gap:5px}
.m.bot .who-tag .orb{width:7px;height:7px;animation:none}
.m+.m.client,.m+.m.bot,.m+.m.owner{margin-top:6px}
.m.sys{align-self:center;max-width:90%}
.m.sys .bub{background:transparent;border:1px dashed var(--line-2);color:var(--text-2);font-size:12.5px;text-align:center;border-radius:12px;padding:7px 12px}
.typing{align-self:flex-end;display:flex;align-items:center;gap:10px;padding:8px 12px 8px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--text-2);animation:slidein .3s var(--ease)}
.typing .tdots{display:flex;gap:3px}
.typing .tdots i{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:dots 1.1s infinite}
.typing .tdots i:nth-child(2){animation-delay:.15s}.typing .tdots i:nth-child(3){animation-delay:.3s}
.typing .orb-lg{width:22px;height:22px}
.typing .orb-lg::after{inset:4px}
.composer{border-top:1px solid var(--line);background:var(--surface);padding:10px 14px 14px;display:grid;gap:10px}
.qr{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.qr button{flex:none;max-width:280px;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);font-size:12.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:border-color .2s,color .2s,background .2s}
.qr button:hover{border-color:var(--accent);color:var(--accent)}
.qr button.personal{border-style:dashed}
.cbox{display:flex;align-items:flex-end;gap:8px;border:1px solid var(--line-2);border-radius:16px;padding:6px 6px 6px 14px;transition:border-color .2s,box-shadow .2s;background:var(--surface)}
.cbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.cbox textarea{flex:1;border:0;outline:none;background:none;resize:none;min-height:24px;max-height:140px;padding:7px 0;line-height:1.45}
.send{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--grad);color:#fff;border:1.5px solid var(--edge);box-shadow:0 2px 0 var(--edge);flex:none;transition:transform .15s}
.send:active{transform:translateY(2px);box-shadow:none}
.c-foot{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.c-foot small{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:6px}
.draft{border:1.5px solid var(--edge);border-radius:16px;padding:12px;background:var(--accent-soft);display:grid;gap:8px;animation:slidein .3s var(--ease)}
.draft b{display:flex;align-items:center;gap:8px;font-size:13px}
.draft textarea{border:1px solid var(--line-2);background:var(--surface);border-radius:12px;padding:9px 11px;min-height:70px;resize:vertical;outline:none}
.draft .acts{display:flex;gap:8px;flex-wrap:wrap}

.info{border-left:1px solid var(--line);overflow-y:auto;background:var(--surface);padding:18px;display:grid;gap:18px;align-content:start}
.info .idh{display:grid;justify-items:center;text-align:center;gap:8px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.info .idh b{font-size:16px}
.info dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 12px;font-size:13px}
.info dt{color:var(--muted)}
.info dd{margin:0;text-align:right;font-weight:650;overflow-wrap:anywhere}
.info h4{font-size:12px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;margin-bottom:8px}
.sumbox{padding:12px;border-radius:14px;background:var(--surface-2);font-size:13px;line-height:1.5;display:flex;gap:10px}
.log{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:12.5px}
.log li{display:grid;grid-template-columns:40px 1fr;gap:8px}
.log time{color:var(--muted);font-family:var(--mono);font-size:11px}
.log .k-book{color:var(--ok);font-weight:700}.log .k-warn{color:var(--warn);font-weight:700}.log .k-mute{color:var(--accent);font-weight:700}
.info-close{display:none}

/* ---------- tables / lists ---------- */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toolbar .ib-search{min-width:220px;flex:1;max-width:360px;background:var(--surface);border-color:var(--line)}
.tbl-wrap{overflow-x:auto}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px}
.tbl th{text-align:left;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{transition:background .15s}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl .person{display:flex;align-items:center;gap:10px;min-width:180px}
.tbl .person b{display:block}
.tbl .person small{color:var(--muted);font-size:12px}
.tbl td.r,.tbl th.r{text-align:right}

/* ---------- requests ---------- */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:10px;align-content:start;min-height:200px}
.col-h{display:flex;align-items:center;gap:8px;padding:4px 4px 2px;font-weight:800;font-size:14px}
.col-h .n{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--muted)}
.col-h i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.col-h i.p{background:var(--warn)}.col-h i.d{background:var(--ok)}
.rq{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px;display:grid;gap:8px;position:relative;overflow:hidden;animation:slidein .35s var(--ease) both}
.rq::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--line-2)}
.rq.high::before{background:var(--hot)}.rq.normal::before{background:var(--warn)}.rq.low::before{background:var(--ok)}
.rq.new-live{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.rq .t{font-weight:800;font-size:14px;line-height:1.3}
.rq .s{font-size:12.5px;color:var(--muted)}
.rq .d{font-size:13px;color:var(--text-2)}
.rq .f{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rq .f .sp{flex:1}
.cal-strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.cal-day{flex:none;width:64px;padding:10px 0;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;justify-items:center;gap:2px;transition:border-color .2s,background .2s}
.cal-day small{font-family:var(--mono);font-size:10px;text-transform:uppercase;color:var(--muted)}
.cal-day b{font-size:19px;font-weight:800}
.cal-day i{font-style:normal;font-size:11px;font-weight:700;color:var(--accent)}
.cal-day[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.cal-day[aria-pressed="true"] small{color:var(--on-dark-2)}
.slot{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
.slot:first-child{border-top:0}
.slot .tm{font-family:var(--mono);font-weight:600;font-size:14px}
.slot strong{display:block}
.slot span{font-size:12.5px;color:var(--muted)}
.slot .acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.slot.live{background:linear-gradient(90deg,var(--accent-soft),transparent 70%)}

/* ---------- settings-like pages ---------- */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:grid;gap:16px;align-content:start}
.svc-tbl td input{width:100%;border:1px solid transparent;background:transparent;padding:7px 8px;border-radius:9px;outline:none}
.svc-tbl td input:hover{border-color:var(--line)}
.svc-tbl td input:focus{border-color:var(--accent);background:var(--surface)}
.svc-tbl td.nm{width:62%}
.svc-tbl input[type=number]{min-width:72px}
.svc-tbl td{padding:4px 8px}
.svc-tbl th{padding:8px}
.hrow{display:grid;grid-template-columns:140px 1fr;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.hrow:first-child{border-top:0}
.hrow label{display:flex;gap:10px;align-items:center;font-weight:650;text-transform:capitalize}
.hrow .times{display:flex;gap:8px;align-items:center}
.hrow input[type=time]{border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:5px 8px}
.mode-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode-cards button{text-align:left;padding:16px;border-radius:16px;border:1.5px solid var(--line);display:grid;gap:6px;transition:border-color .2s,box-shadow .2s,transform .2s}
.mode-cards button:hover{transform:translateY(-2px)}
.mode-cards button[aria-pressed="true"]{border-color:var(--edge);box-shadow:0 3px 0 var(--edge);background:var(--accent-soft)}
.mode-cards b{font-size:15px}
.mode-cards small{color:var(--muted);font-size:13px}
.import-res{display:grid;gap:4px}
.import-res .r{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:7px 0;border-bottom:1px dashed var(--line-2)}
.err{color:var(--hot);font-size:13px;font-weight:650}

.int-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.int{padding:20px;display:grid;gap:14px;align-content:start}
.int .top{display:flex;align-items:center;gap:12px}
.int .lg{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:13px;background:var(--surface-3);color:var(--text);border:1px solid var(--line-2)}
.int.on .lg{background:var(--text);color:var(--bg)}
.int h3{font-size:16px}
.int p{color:var(--muted);font-size:13.5px;min-height:3em}
.int .f{display:flex;align-items:center;justify-content:space-between;gap:8px}
.skel{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--surface-3) 25%,var(--surface-2) 50%,var(--surface-3) 75%);background-size:200% 100%;animation:shimmer 1.2s linear infinite}

.chart{position:relative}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart .ax{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .bar{fill:var(--accent);transition:opacity .2s}
.chart .bar.dim{fill:var(--accent);opacity:.35}
.chart .hit{fill:transparent;cursor:crosshair}
.chart .hit:hover+.bar,.chart g.b:hover .bar{opacity:1;filter:brightness(1.08)}
.viz-tip{position:fixed;z-index:80;pointer-events:none;background:var(--text);color:var(--bg);padding:7px 10px;border-radius:10px;font-size:12.5px;font-weight:700;box-shadow:var(--sh-2);transform:translate(-50%,calc(-100% - 12px));white-space:nowrap}
.viz-tip small{display:block;font-weight:600;opacity:.7;font-size:11px}
.big-num{font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1}

.profile-hero{padding:24px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.plan{padding:22px;display:grid;gap:14px}
.meter{height:8px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
.meter i{display:block;height:100%;background:var(--grad);border-radius:4px}

/* ---------- auth ---------- */
.auth{min-height:100dvh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);background:var(--bg)}
.auth-art{margin:12px;border-radius:30px;padding:40px;display:flex;flex-direction:column;gap:28px;justify-content:space-between;min-height:calc(100dvh - 24px)}
.auth-art .mark-big{animation:bob 6s ease-in-out infinite;filter:drop-shadow(0 30px 40px rgba(247,37,133,.45))}
.auth-art h2{font-size:clamp(30px,3.6vw,48px);font-weight:800;letter-spacing:-.04em;line-height:1.02;max-width:14ch}
.auth-art h2 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.auth-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.auth-stats div{padding:14px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.auth-stats b{font-size:24px;font-weight:800;display:block;letter-spacing:-.03em}
.auth-stats .as-ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;margin-bottom:10px;background:linear-gradient(135deg,#FF4FA3,#F72585);color:#fff;box-shadow:0 6px 18px -6px rgba(247,37,133,.8)}
.auth-stats .as-ic .svg{width:16px;height:16px}
.auth-stats div{transition:transform .25s var(--ease),background .25s}
.auth-stats div:hover{transform:translateY(-3px);background:rgba(255,255,255,.09)}
.auth-stats small{font-size:12px;color:var(--on-dark-2)}
.quote{font-size:15px;line-height:1.55;color:var(--on-dark-2);max-width:48ch}
.quote b{color:#fff;display:block;margin-top:10px;font-size:13.5px}
.auth-form{display:grid;place-items:center;padding:32px max(20px,env(safe-area-inset-right,0px)) 32px max(20px,env(safe-area-inset-left,0px))}
.auth-box{width:100%;max-width:400px;display:grid;gap:18px}
.auth-box h1{font-size:32px;font-weight:800;letter-spacing:-.04em}
.auth-box .sub{color:var(--muted);margin-top:6px}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12.5px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line-2)}
.auth-top{display:flex;justify-content:space-between;align-items:center;gap:12px}

/* ---------- marketing site ---------- */
.site{min-height:100%;background:var(--bg)}
.s-nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.s-wrap{max-width:1180px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.s-nav .s-wrap{display:flex;align-items:center;gap:14px;height:64px}
.s-nav .links{display:flex;gap:4px;margin-left:18px;margin-right:auto}
.s-nav .links a{padding:8px 12px;border-radius:10px;text-decoration:none;font-weight:650;font-size:14px;color:var(--text-2)}
.s-nav .links a:hover{background:var(--surface-2);color:var(--text)}
.s-hero{padding-block:clamp(40px,7vw,90px) 40px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:40px;align-items:center}
.s-hero h1{font-size:clamp(42px,6.4vw,84px);font-weight:800;letter-spacing:-.055em;line-height:.95;margin:18px 0 20px}
.s-hero h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.s-hero .lead{font-size:18px;color:var(--text-2);max-width:52ch;line-height:1.55}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:26px}
.vchip{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);font-weight:700;font-size:13.5px;color:var(--text-2);background:var(--surface);transition:all .2s}
.vchip:hover{border-color:var(--text)}
.vchip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.cta-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.mock{position:relative;padding:22px}
.mock .phone{border-radius:30px;padding:16px;background:var(--surface);border:1.5px solid var(--edge);box-shadow:0 6px 0 var(--edge),var(--sh-pink);display:grid;gap:8px;position:relative;z-index:1}
.mock .ph{display:flex;gap:10px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--line)}
.mock .ph b{display:block;font-size:14px}.mock .ph small{font-size:12px;color:var(--muted)}
.mock .mb{max-width:86%;padding:9px 12px;border-radius:16px;font-size:13.5px;line-height:1.4;animation:slidein .5s var(--ease) both}
.mock .mb.out{justify-self:start;background:var(--surface-2);border-bottom-left-radius:5px}
.mock .mb.in{justify-self:end;background:var(--bubble-ai);color:var(--bubble-ai-ink);border-bottom-right-radius:5px}
.float{position:absolute;z-index:2;background:var(--surface);border:1.5px solid var(--edge);border-radius:16px;padding:10px 14px;box-shadow:0 4px 0 var(--edge);display:flex;gap:10px;align-items:center;font-size:13px;font-weight:700;animation:bob 5s ease-in-out infinite}
.float.a{top:-4px;right:-6px}.float.b{bottom:30px;left:-16px;animation-delay:-2.5s}
.float .k{font-size:20px;font-weight:800;letter-spacing:-.03em}
.s-sec{padding-block:56px}
.s-sec h2{font-size:clamp(28px,3.6vw,44px);font-weight:800;letter-spacing:-.045em;max-width:20ch}
.s-sec .intro{color:var(--muted);margin-top:10px;max-width:60ch;font-size:16px}
.feat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:28px}
.feat{padding:22px;display:grid;gap:10px;align-content:start}
.feat .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.feat h3{font-size:17px}
.feat p{color:var(--muted);font-size:14px}
.safe-band{padding:clamp(24px,4vw,44px);display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:32px;align-items:center}
.safe-band h2{color:#fff}
.safe-band .intro{color:var(--on-dark-2)}
.safe-band ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.safe-band li{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);font-size:14px}
.safe-band li .svg{color:var(--accent-2);margin-top:1px}
.price-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:28px;align-items:stretch}
.price{padding:26px;display:grid;gap:14px;align-content:start;position:relative}
.price.hot{background:var(--dark);color:var(--on-dark);border:1.5px solid var(--pink);box-shadow:var(--sh-pink)}
.price.hot .muted,.price.hot li{color:var(--on-dark-2)}
.price .tag{position:absolute;top:-12px;left:22px}
.price .amt{font-size:48px;font-weight:800;letter-spacing:-.05em;line-height:1}
.price .amt small{font-size:15px;font-weight:600;color:var(--muted);letter-spacing:0}
.price ul{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:14px;color:var(--text-2)}
.price li{display:flex;gap:8px;align-items:flex-start}
.price li .svg{color:var(--accent);width:16px;height:16px;margin-top:2px}
.trial-bar{margin-top:20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;border-radius:16px;border:1.5px dashed var(--accent);background:var(--accent-soft);font-weight:650}
.geo-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:28px}
.geo{padding:22px;display:grid;gap:8px}
.geo .cc{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent);letter-spacing:.08em}
.geo h3{font-size:18px}.geo p{color:var(--muted);font-size:14px}
.calc{margin-top:28px;padding:26px;display:grid;gap:14px}
.calc .row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.calc input[type=range]{flex:1;min-width:200px;accent-color:var(--accent)}
.calc output{font-size:40px;font-weight:800;letter-spacing:-.045em}
.s-foot{margin-top:40px;padding:clamp(28px,5vw,56px);display:grid;gap:18px;justify-items:start}
.s-foot h2{color:#fff;max-width:18ch}

/* ---------- overlays ---------- */
.toasts{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:90;display:grid;gap:8px;justify-items:end}
.toast{display:flex;align-items:center;gap:10px;background:var(--text);color:var(--bg);padding:11px 12px 11px 14px;border-radius:14px;font-weight:700;font-size:13.5px;box-shadow:var(--sh-2);animation:slidein .35s var(--ease);max-width:min(420px,calc(100vw - 40px))}
.toast .svg{color:var(--accent-2)}
.toast button{height:28px;padding:0 10px;border-radius:8px;background:rgba(255,255,255,.14);color:inherit;font-weight:800;font-size:12.5px}
.pop{position:absolute;top:calc(100% + 8px);right:0;width:min(380px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line-2);border-radius:18px;box-shadow:var(--sh-2);padding:8px;z-index:50;animation:slidein .25s var(--ease)}
.pop .ph{display:flex;align-items:center;justify-content:space-between;padding:8px 10px}
.pop .ph b{font-size:14px}
.nt{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:10px;border-radius:12px;text-align:left;width:100%}
.nt:hover{background:var(--surface-2)}
.nt p{font-size:13px;line-height:1.4}
.nt time{font-size:11.5px;color:var(--muted)}
.nt.unread p{font-weight:700}
.scrim{position:fixed;inset:0;background:rgba(21,16,21,.45);backdrop-filter:blur(3px);z-index:70;animation:fade .2s}
.cmdk{position:fixed;left:50%;top:14vh;transform:translateX(-50%);width:min(560px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line-2);border-radius:20px;box-shadow:0 30px 80px -20px rgba(0,0,0,.45);z-index:75;overflow:hidden;animation:slidein .25s var(--ease)}
.cmdk .in{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.cmdk input{border:0;outline:none;background:none;flex:1;font-size:16px}
.cmdk ul{list-style:none;margin:0;padding:8px;max-height:52vh;overflow-y:auto}
.cmdk li button{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;text-align:left;font-weight:650}
.cmdk li button[aria-selected="true"],.cmdk li button:hover{background:var(--surface-2)}
.cmdk li small{margin-left:auto;color:var(--muted);font-size:12px}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:75;background:var(--surface);border-radius:24px 24px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -20px 60px -20px rgba(0,0,0,.4);animation:slidein .3s var(--ease);max-height:85dvh;overflow-y:auto}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line-2);margin:4px auto 14px}
.sheet-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sheet-grid button{display:grid;justify-items:center;gap:8px;padding:16px 8px;border-radius:16px;background:var(--surface-2);font-weight:700;font-size:12.5px}
.sheet-grid .svg{width:22px;height:22px;color:var(--accent)}

.boot{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg);transition:opacity .45s var(--ease),visibility .45s}
.boot.done{opacity:0;visibility:hidden}
.boot .in{display:grid;justify-items:center;gap:18px}
.boot svg .ln{stroke-dasharray:260;animation:draw 1s var(--ease) both}
.boot .bar{width:120px;height:3px;border-radius:2px;background:var(--line);overflow:hidden}
.boot .bar i{display:block;height:100%;width:40%;background:var(--grad);border-radius:2px;animation:loadbar .9s var(--ease) infinite}
@keyframes loadbar{from{transform:translateX(-100%)}to{transform:translateX(260%)}}

/* ---------- industry accents (the Reza brand pink stays on logo and primary actions) ---------- */
:root{--ind:#E14D86}
:root[data-v="beauty"],.v-beauty{--ind:#E14D86}
:root[data-v="artisan"],.v-artisan{--ind:#3B6FF0}
:root[data-v="concierge"],.v-concierge{--ind:#119C90}
:root[data-v="property"],.v-property{--ind:#7A5CF0}
.ind-badge{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 10px 0 8px;border-radius:999px;background:color-mix(in srgb,var(--ind) 13%,transparent);color:var(--ind);font-weight:800;font-size:12px;white-space:nowrap;border:1px solid color-mix(in srgb,var(--ind) 22%,transparent)}
.ind-badge .svg{width:14px;height:14px}
.ind-tile{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--ind);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),0 6px 16px -8px var(--ind)}
.ind-tile .svg{width:17px;height:17px}
.ind-tile.lg{width:44px;height:44px;border-radius:13px}
.ws{box-shadow:inset 3px 0 0 var(--ind)}
.vchip .vd{width:8px;height:8px;border-radius:3px;background:var(--ind);transform:rotate(45deg);display:inline-block;margin-right:8px}
.vchip{display:inline-flex;align-items:center}
.col-h i{background:var(--ind)}
.cal-day i{color:var(--ind)}

/* ---------- logo ---------- */
.logo-svg{display:block;overflow:visible;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.logo:hover .logo-svg,a:hover>.logo-svg{transform:translateY(-2px) rotate(-2deg) scale(1.03)}
.boot .in>span .logo-svg{animation:logoIn .9s cubic-bezier(.3,1.5,.5,1) both}
.auth-art .mark-big{animation:logoIn .9s cubic-bezier(.3,1.5,.5,1) both, bob 6s ease-in-out 1s infinite}
@keyframes logoIn{0%{opacity:0;transform:translateY(14px) scale(.86) rotate(-4deg)}100%{opacity:1;transform:none}}
.logo-icon{display:none}
.boot .in>span{animation:pop .6s var(--ease) both}

/* ---------- onboarding, sources, notes, modal ---------- */
.ob{padding:20px 22px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center}
.ob-ring{position:relative;width:64px;height:64px}
.ob-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ob-ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:800}
.ob-steps{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ob-step{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px 0 8px;border-radius:11px;border:1px solid var(--line-2);font-size:13px;font-weight:700;background:var(--surface);transition:border-color .2s,transform .2s}
.ob-step:hover{border-color:var(--text);transform:translateY(-1px)}
.ob-step .ck{width:20px;height:20px;border-radius:50%;border:1.5px dashed var(--line-2);display:grid;place-items:center;flex:none}
.ob-step.done{color:var(--muted);background:var(--surface-2);border-color:transparent;text-decoration:line-through;text-decoration-color:var(--line-2)}
.ob-step.done .ck{border:0;background:var(--ok);color:#fff}
.ob-step.done .ck .svg{width:12px;height:12px;stroke-width:3}
.src{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;padding-inline:6px}
.src span{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--text-2);border:1px solid var(--line)}
.note-ta{width:100%;min-height:76px;border:1px dashed var(--line-2);background:color-mix(in srgb,#FFD86B 10%,var(--surface));border-radius:12px;padding:9px 11px;resize:vertical;outline:none;font-size:13px}
.note-ta:focus{border-style:solid;border-color:var(--warn)}
.tsel{border:1px solid var(--line-2);background:var(--surface);border-radius:9px;padding:6px 8px;font-variant-numeric:tabular-nums;font-weight:650}
.only-m{display:none}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 32px));max-height:86dvh;overflow-y:auto;background:var(--surface);border:1px solid var(--line-2);border-radius:24px;z-index:75;box-shadow:0 30px 80px -20px rgba(0,0,0,.45);animation:fade .25s}
.modal .mh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.mail{margin:16px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--bg)}
.mail .meta{padding:12px 16px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line);display:grid;gap:2px;background:var(--surface)}
.mail .meta b{color:var(--text)}
.mail .body{padding:24px;display:grid;gap:16px}
.mail .body h3{font-size:22px}
.mail .tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mail .tiles div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.mail .tiles b{display:block;font-size:22px;font-weight:800}
.mail .tiles small{font-size:12px;color:var(--muted)}
.mail .foot{font-size:11.5px;color:var(--muted);border-top:1px solid var(--line);padding:14px 24px}

/* ---------- integrations (server mode) ---------- */
.int-two{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:stretch}
.int-hero{padding:22px;display:grid;gap:14px;align-content:start;border-width:1.5px}
.int-hero.on{border-color:var(--ok)}
.int-top{display:flex;gap:14px;align-items:flex-start}
.int-top h3{font-size:18px}
.int-top p{font-size:13.5px;margin-top:2px}
.lg.tg{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none;color:#fff;background:linear-gradient(135deg,#37AEE2,#1E96C8);box-shadow:0 8px 20px -8px #1E96C8}
a.btn,a.btn:hover{text-decoration:none}
.inst-ov{position:fixed;inset:0;z-index:80;background:rgba(21,16,21,.55);display:grid;place-items:end center;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.inst-ov{place-items:center}}
.inst-box{width:min(460px,100%);padding:20px;display:grid;gap:14px}
.lg.ig{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none;color:#fff;background:radial-gradient(circle at 30% 107%,#fdf497 0%,#fd5949 45%,#d6249f 60%,#285AEB 95%);box-shadow:0 8px 20px -8px #d6249f}
.isteps{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:s}
.ist{display:grid;grid-template-columns:28px minmax(0,1fr);gap:12px;align-items:start;padding:12px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.ist .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--surface);border:1.5px solid var(--line-2)}
.ist.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.ist.done{background:color-mix(in srgb,var(--ok) 7%,var(--surface))}
.ist b{font-size:14px}
.ist .mono{font-size:13px;color:var(--accent)}
.hint-line{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--muted)}
.int-safe{padding:24px;display:grid;gap:16px;align-content:start}
.int-safe h3{font-size:20px;color:#fff;margin-top:8px}
.int-safe ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.int-safe li{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--on-dark-2);line-height:1.45}
.int-safe li .svg{color:var(--accent-2);margin-top:2px;flex:none}
.int.on{border-color:var(--ok)}
@media (max-width:1100px){.int-two{grid-template-columns:1fr}}

/* ---------- client marketplace ---------- */
.c-hero{padding-block:clamp(28px,5vw,60px) 0;display:grid;gap:14px}
.c-hero h1{font-size:clamp(34px,5vw,64px);font-weight:800;letter-spacing:-.05em;line-height:.98;max-width:16ch}
.c-hero h1 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.c-search{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) auto;gap:8px;padding:8px;border-radius:20px;background:var(--surface);border:1.5px solid var(--edge);box-shadow:0 4px 0 var(--edge),var(--sh-pink);max-width:860px;margin-top:10px}

function logoLayers(id, ring=true){

  return `<filter id="${f}" x="-12%" y="-35%" width="128%" height="185%" color-interpolation-filters="sRGB">

</defs>`;

/* slots for the booking industry */
function freeSlots(days=7){
  const st = S(), res = [], now = new Date();
  for(let i=0;i<days;i++){
    const d = addDays(now,i), h = st.biz.hours[d.getDay()]; if(!h) continue;
    const ds = iso(d);
    for(let m=toMin(h[0]); m+60<=toMin(h[1]); m+=60){
      const tm = `${pad(Math.floor(m/60))}:${pad(m%60)}`;
      if(i===0 && m <= now.getHours()*60+now.getMinutes()+60) continue;
      if(st.items.some(b => b.kind==="booking" && b.date===ds && b.time===tm)) continue;
      res.push({date:ds,time:tm});
    }
  }
  return res;
}
const slotFree = (date,time) => freeSlots(14).some(s => s.date===date && s.time===time);

  const st = S(), real = st.items.filter(i => !i.example), base = V[vk].base;

  const handled = base[0]*4 + real.length + msgs.filter(m=>m.from==="client").length;
  const revenue = base[0]*avgT() + real.reduce((a,i) => a + (i.price||i.value||0), 0);

  const active = st.convos.filter(c => ["ai","waiting"].includes(c.status) || c.human).length + (msgs.length?1:0);

/* ---------- Analytics (charts drawn to one scale, hover tooltips) ---------- */
function niceMax(v){ if(!(v > 0)) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))); return Math.ceil(v/p*2)/2*p; }
function barChart(values, labels, unit=""){
  const W = 640, H = 220, L = 34, R = 6, Tp = 10, B = 24, max = niceMax(Math.max(...values)*1.05);
  const iw = W-L-R, ih = H-Tp-B, bw = iw/values.length, w = Math.max(6, bw*0.58);
  const y = (v) => Tp + ih - (v/max)*ih;
  const ticks = [0, max/2, max];
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img">`;
  ticks.forEach(tk => { s += `<line class="grid" x1="${L}" x2="${W-R}" y1="${y(tk)}" y2="${y(tk)}"/><text class="ax" x="${L-8}" y="${y(tk)+3}" text-anchor="end">${nf(Math.round(tk))}</text>`; });
  values.forEach((v,i) => {
    const x = L + i*bw + (bw-w)/2, top = y(v), base = y(0), r = Math.min(4, base-top);
    s += `<g class="b"><path class="bar ${i===values.length-1?"":"dim"}" d="M${x},${base} V${top+r} Q${x},${top} ${x+r},${top} H${x+w-r} Q${x+w},${top} ${x+w},${top+r} V${base} Z"/>
      <rect class="hit" x="${L+i*bw}" y="${Tp}" width="${bw}" height="${ih}" data-tip="${nf(v)}${unit}" data-sub="${esc(labels[i])}"/></g>`;
    if(i%2===values.length%2 || i===values.length-1) s += `<text class="ax" x="${x+w/2}" y="${H-6}" text-anchor="middle">${esc(labels[i].split(" ")[0])}</text>`;
  });
  return s + `</svg>`;
}
function lineChart(values, labels, unit=""){
  const W = 640, H = 200, L = 34, R = 10, Tp = 12, B = 24, max = niceMax(Math.max(...values)*1.2);
  const iw = W-L-R, ih = H-Tp-B, step = iw/(values.length-1);
  const x = (i) => L + i*step, y = (v) => Tp + ih - (v/max)*ih;
  const d = values.map((v,i) => (i?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1)).join(" ");
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img"><defs><linearGradient id="lg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--ind);stop-opacity:.22"/><stop offset="1" style="stop-color:var(--ind);stop-opacity:0"/></linearGradient></defs>`;
  [0,max/2,max].forEach(tk => { s += `<line class="grid" x1="${L}" x2="${W-R}" y1="${y(tk)}" y2="${y(tk)}"/><text class="ax" x="${L-8}" y="${y(tk)+3}" text-anchor="end">${nf(Math.round(tk))}</text>`; });
  s += `<path d="${d} L${x(values.length-1)} ${y(0)} L${x(0)} ${y(0)} Z" fill="url(#lg1)"/><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>`;
  const li = values.length-1; s += `<circle cx="${x(li)}" cy="${y(values[li])}" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>`;
  values.forEach((v,i) => { s += `<rect class="hit" x="${x(i)-step/2}" y="${Tp}" width="${step}" height="${ih}" data-tip="${nf(v)}${unit}" data-sub="${esc(labels[i])}"/>`; if(i%3===0 || i===li) s += `<text class="ax" x="${x(i)}" y="${H-6}" text-anchor="middle">${esc(labels[i].split(" ")[0])}</text>`; });
  return s + `</svg>`;
}
function hbars(rows){ const max = Math.max(...rows.map(r => r[1])); return `<div class="bars-list">${rows.map(([l,v,suffix]) => `<div class="bl" data-tip="${nf(v)}" data-sub="${esc(l)}"><div class="t"><span>${esc(l)}</span><span>${nf(v)}${suffix||""}</span></div><div class="track"><i style="width:${(v/max*100).toFixed(1)}%"></i></div></div>`).join("")}</div>`; }
function pageAnalytics(){

const CAT_V = ["beauty","artisan"];
const ownState = (v) => store.data[v+"_"+lang];
function masters(){
  const c = CAT[lang], out = [];
  CAT_V.forEach(v => {
    const base = ownState(v)?.biz || V[v].biz[lang];

      out.push({id:`m-${v}-${i}`, v, own:i===0, name: i===0 ? base.name : name, area:c.areas[i], address: i===0 ? base.address : `${c.areas[i]}, ${base.city}`,

        services, hours: base.hours});
    });

  return out;
}

    const d = addDays(now,i), h = m.hours[d.getDay()]; if(!h) continue;
    const ds = iso(d), r = rng(hash(m.id+ds));
    for(let x=toMin(h[0]); x+60<=toMin(h[1]); x+=60){
      const tm = `${pad(Math.floor(x/60))}:${pad(x%60)}`;
      if(i===0 && x <= now.getHours()*60+now.getMinutes()+60) continue;
      if(own ? own.items.some(b => b.kind==="booking" && b.date===ds && b.time===tm) : r() < 0.45) continue;
      if((store.cbook||[]).some(b => b.mid===m.id && b.date===ds && b.time===tm)) continue;
      res.push({date:ds, time:tm});
    }
  }
  return res;
}

function toast(msg, icon="check", action){
  const box = $("#toasts"), el = document.createElement("div"); el.className = "toast";
  el.innerHTML = `${ic(icon)}<span>${esc(msg)}</span>`;
  if(action){ const b = document.createElement("button"); b.textContent = action.label; b.onclick = () => { el.remove(); action.fn(); }; el.append(b); }
  box.append(el); setTimeout(() => { el.style.transition = "opacity .3s, transform .3s"; el.style.opacity = "0"; el.style.transform = "translateY(8px)"; setTimeout(() => el.remove(), 320); }, 4200);
  while(box.children.length > 3) box.firstChild.remove();
}

function buildRules(){
  const st = S(), biz = st.biz, isB = isBooking();
  const wd = ["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];
  const hoursTxt = [1,2,3,4,5,6,0].map(d => `${wd[d]}: ${biz.hours[d] ? biz.hours[d].join("–") : "closed"}`).join("; ");
  const svcTxt = biz.services.map(s => `- ${s.name}: ${s.price} €${s.duration?`, ${t("min")(s.duration)}`:""}`).join("\n");
  const noteLang = {ru:"Russian",fr:"French",de:"German"}[lang];
  const tone = {warm:"warm and friendly", pro:"polite and businesslike", short:"very short and to the point"}[st.tone];
  let head = `You are the AI employee of "${biz.name}" (${biz.kind}) in ${biz.city}. Owner/contact person: ${biz.owner}. Address or area: ${biz.address}.
You answer people who write to the business on ${CH_NAME[defCh()]}. Today is ${iso(new Date())} (${wd[new Date().getDay()]}), current time ${nowHM()}.

RULES
- Reply in the language the person writes in. Natural WhatsApp style, ${tone}: 1–3 sentences, at most one emoji. In Russian address the person formally ("вы"), in French use "vous", in German "Sie".
- Only use the facts below. Never invent prices, services, availability or rules.
- ${st.guard.offtopic ? `PERSONAL MESSAGES: if the message is clearly personal and not about the business (a friend, family member, partner, flirting, private plans, spam), you must NOT answer: action "ignore" and reply "".` : `If the message is personal and not about the business, reply politely in one sentence that this is the business line of ${biz.name}.`}
- If you cannot answer from the facts, or it is a complaint or a sensitive topic (health, money disputes, damages), say politely that ${biz.owner} will answer personally very soon, and set action "handoff".

SERVICES / PRICES
${svcTxt}

HOURS
${hoursTxt}

KNOWLEDGE AND RULES OF THE BUSINESS
${biz.policy}
`;
  const existing = chatItemId ? st.items.find(i => i.id===chatItemId) : null;
  if(isB){
    const byDay = {}; freeSlots(7).forEach(s => (byDay[s.date] ||= []).push(s.time));
    const slotTxt = Object.entries(byDay).map(([d,ts]) => `- ${d} (${wd[parseIso(d).getDay()]}): ${ts.join(", ")}`).join("\n") || "- none this week";
    head += `
FREE SLOTS (only these can be booked)
${slotTxt}

BOOKING
- To book you need: a service from the list, a free slot from the list, and the client's first name. Ask for what is missing, one question at a time. Propose at most 3 slots at once.
- Set action "book" only when service + slot + name are known and the client has agreed. Confirm in the reply and say a reminder will be sent the day before.${st.guard.deposit ? "\n- Deposit: after confirming a booking, say that a link to pay a 20% deposit will follow by message." : ""}
- To move a booking, set action "book" with the new slot (the old one is released automatically). To cancel, action "cancel".
${existing ? `THIS CLIENT ALREADY HAS: ${existing.service}, ${existing.date} ${existing.time}, name ${existing.client}.` : "This client has no booking yet."}

OUTPUT: only one JSON object, no other text:
{"reply": "...", "sources": ["prices"|"hours"|"slots"|"rules", ...the facts you used], "action": "none"|"book"|"cancel"|"handoff"|"ignore", "booking": {"name":"...","service":"exact service name","date":"YYYY-MM-DD","time":"HH:MM"} or null, "note": "one short sentence in ${noteLang} for the owner's log: what you understood or did"}`;
  } else {
    head += `
REQUESTS
- Turn the conversation into a ready-to-handle request for the team. Find out: what is needed or what the problem is, where (address / apartment / accommodation), how urgent, the person's name, and if useful a photo or availability. Ask at most 2 short questions per message.
- If it is urgent or dangerous (water, gas, electricity, someone stuck), give the safety instructions from the knowledge FIRST.
- If the request is outside the area or not a job the business does, decline politely (action "none").
- As soon as you have enough to act (at least what + where; ask the name if missing, but never block an emergency on it), set action "request" and say clearly what happens next. If a request already exists in this chat and new details arrive, set action "request" again with the completed data.
- urgency: "high" (danger, damage spreading, people blocked), "normal" (action in 1–3 days), "low" (question, information, small issue).
- assignee: the right person or team role from the knowledge. value: estimated euros from the price list, or 0.
${existing ? `A REQUEST ALREADY EXISTS IN THIS CHAT: ${existing.title} (${existing.address}).` : ""}

OUTPUT: only one JSON object, no other text:
{"reply": "...", "sources": ["prices"|"hours"|"rules", ...the facts you used], "action": "none"|"request"|"handoff"|"ignore", "request": {"name":"...","title":"short title in ${({ru:"Russian",fr:"French",de:"German"})[lang]}","address":"...","details":"key facts in one sentence","urgency":"high"|"normal"|"low","assignee":"...","value":0} or null, "note": "one short sentence in ${noteLang} for the owner's log: what you understood or did"}`;
  }
  return head;
}

async function send(text){
  text = (text||"").trim(); if(!text || busy || pendingDraft) return;
  const st = S();
  lastIgnored = false; if(!st.ob.test){ st.ob.test = true; save(); }
  msgs.push({from:"client", text, ts:Date.now()}); turns.push({role:"user",content:text});
  log(t("l_asked") + "«" + (text.length>50 ? text.slice(0,47)+"…" : text) + "»");
  if(testHuman || st.paused){ addMsg("sys", st.paused ? "note_paused" : "note_takeover", true); return; }
  if(st.guard.offhours && inHoursNow()){ addMsg("sys", "note_offhours", true); pushAlert("handoff", t("test_name")); save(); return; }
  if(aiMode !== "on" && !SRV.on){ refreshInbox(); return fallbackReply(text); }
  busy = true; refreshInbox();
  if(!consentNoted){ consentNoted = true; log(t("c_consent")); }
  try{
    const res = aiMode !== "on" ? await srvAI() : await sample.json([{role:"user",content:buildRules()}, ...turns.slice(-16)], {modelTier:"quick", cache:false});
    busy = false; handleAi(res);
  }catch(e){
    busy = false;
    const code = e && e.code;
    if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(code)){
      aiMode = "off"; msgs.push({from:"sys", text:t("c_fallback"), ts:Date.now()}); return fallbackReply(text);
    }
    turns.pop(); msgs.pop();
    toast(code==="srv_ai_off" ? t("srv_ai_off") : code==="rate_limited" ? t("c_rate") : t("c_err"), "info", {label:"↻", fn:() => send(text)});
    refreshInbox();
  }
}
function handleAi(res){
  if(!res || typeof res !== "object"){ addMsg("sys", t("c_err")); return; }
  if(res.note) log(String(res.note));
  if(res.action === "ignore" || (!res.reply && res.action !== "book" && res.action !== "request")){
    turns.pop(); lastIgnored = true;
    log(t("l_ignore"),"mute"); pushAlert("personal", t("test_name")); S().activity.push({kind:"mute", name:t("test_name"), ts:Date.now()}); save();
    addMsg("sys", "note_personal", true); return;
  }
  if(S().mode === "suggest"){
    pendingDraft = res; msgs.push({from:"sys", text:t("c_waiting"), ts:Date.now()}); log(t("l_draft"));
    refreshInbox(); setTimeout(() => $("#draftText")?.focus({preventScroll:true}), 30); return;
  }
  applyResult(res, String(res.reply||""));
  refreshInbox();
}
function applyResult(res, reply){
  reply = reply.trim();
  const st = S(), action = res.action || "none";
  if(action==="book" && res.booking){
    const bk = res.booking, wanted = String(bk.service||"").toLowerCase();
    const svc = st.biz.services.find(s => s.name.toLowerCase()===wanted) || st.biz.services.find(s => wanted && s.name.toLowerCase().includes(wanted.slice(0,6))) || st.biz.services[0];
    const date = String(bk.date||""), time = String(bk.time||"").padStart(5,"0");
    const prev = chatItemId ? st.items.find(i => i.id===chatItemId) : null;
    if(!(prev && prev.date===date && prev.time===time)){
      if(prev) st.items = st.items.filter(i => i.id!==prev.id);
      if(slotFree(date,time)) createBooking(String(bk.name||t("client_default")).trim(), svc, date, time);
      else {
        log(t("l_taken"),"warn");
        const alt = freeSlots(7).slice(0,3).map(s => `${fmtDay(s.date)} ${s.time}`).join(", ");
        reply = t("b_taken")(alt);
      }
    }
  } else if(action==="cancel" && chatItemId){
    st.items = st.items.filter(i => i.id!==chatItemId); chatItemId = null; save(); log(t("l_cancel"),"warn");
  } else if(action==="request" && res.request){
    upsertRequest(res.request);
  } else if(action==="handoff"){
    log(t("l_handoff"),"warn"); pushAlert("handoff", t("test_name")); st.activity.push({kind:"handoff", name:t("test_name"), ts:Date.now()}); save();
  } else {
    st.activity.push({kind:"reply", name:t("test_name"), ts:Date.now()}); save();
  }
  if(reply){ turns.push({role:"assistant",content:reply}); msgs.push({from:"bot", text:reply, ts:Date.now(), src:(Array.isArray(res.sources)?res.sources:[]).filter(x => ["prices","hours","slots","rules"].includes(x)).slice(0,3)}); }
}
function createBooking(name, svc, date, time){
  const st = S();
  const b = {id:uid(),kind:"booking",client:name,service:svc.name,price:svc.price,date,time,source:defCh(),status:"new",example:false,deposit:!!S().guard.deposit};
  st.items.push(b); chatItemId = b.id;
  st.activity.push({kind:"book", name, x:`${svc.name}, ${fmtShort(date)} ${time}`, ts:Date.now()});
  st.alerts.push({id:uid(), type:"book", name, x:`${fmtShort(date)} ${time}`, ts:Date.now()});
  save();
  log(`${t("l_booked")}: ${name}, ${svc.name}, ${fmtDay(date)} ${time}`,"book");
  log(`${t("l_remind")} ${fmtDay(iso(addDays(parseIso(date),-1)))}, ${time}`);
  toast(`${t("toast_book")}: ${name}`, "cal", {label:t("open"), fn:() => go("requests")});
}
function upsertRequest(r){
  const st = S();
  const urgency = ["high","normal","low"].includes(r.urgency) ? r.urgency : "normal";
  const data = {client:String(r.name||"—").slice(0,60), title:String(r.title||"—").slice(0,90), address:String(r.address||"—").slice(0,90),
                details:String(r.details||"").slice(0,200), urgency, assignee:String(r.assignee||"").slice(0,40), value:Math.max(0,Math.round(+r.value||0))};
  const existing = chatItemId ? st.items.find(i => i.id===chatItemId) : null;
  if(existing) Object.assign(existing, data, {status:"new"});
  else {
    const it = {id:uid(), kind:"request", date:iso(new Date()), source:defCh(), status:"new", stage:"new", example:false, ...data};
    st.items.push(it); chatItemId = it.id;
    st.activity.push({kind:"req", name:data.client, x:data.title, ts:Date.now()});
    st.alerts.push({id:uid(), type:"req", name:data.client, x:data.title, ts:Date.now()});
    toast(`${t("toast_req")}: ${data.title}`, "ticket", {label:t("open"), fn:() => go("requests")});
  }
  save();
  log(`${t("l_request")}: ${data.title} · ${t("urg")[urgency]}${data.assignee ? " → "+data.assignee : ""}`,"book");
}

let importResult = null;
async function doImport(){
  const out = $("#impRes"); out.innerHTML = "";
  const say = (txt, cls) => out.insertAdjacentHTML("beforeend", `<p class="${cls||"muted"}">${esc(txt)}</p>`);
  const text = $("#impText").value.trim(), file = $("#impPhoto")?.files?.[0];
  if(!text && !file){ say(t("imp_none"),"err"); return; }
  if(aiMode!=="on" || !sample){ say(t("imp_off"),"err"); return; }
  out.innerHTML = `<div style="display:grid;gap:8px"><div class="skel" style="width:80%"></div><div class="skel" style="width:60%"></div><div class="skel" style="width:70%"></div><span class="muted" style="font-size:13px">${t("imp_wait")}</span></div>`;
  try{
    const prompt = `Extract the services from this price list of a small business (${S().biz.kind})${file?" (see the attached photo)":""}. Reply with only a JSON array of objects {"name": string, "price": number in euros, "duration": number in minutes}. Keep names in their original language, cleaned up. If a duration is missing, estimate a typical one.${text ? "\n\nPrice list:\n"+text.slice(0,4000) : ""}`;
    const opts = {modelTier:"quick", cache:false}; if(file) opts.images = file;
    const arr = await sample.json(prompt, opts);
    const clean = (Array.isArray(arr)?arr:[]).filter(x => x && x.name).map(x => ({name:String(x.name).slice(0,80), price:Math.max(0,Math.round(+x.price||0)), duration:Math.max(0,Math.round(+x.duration||30))})).slice(0,30);
    out.innerHTML = "";
    if(!clean.length){ say(t("imp_fail"),"err"); return; }
    importResult = clean;
    out.innerHTML = clean.map(s => `<div class="r"><span>${esc(s.name)}</span><span class="num">${s.price} € · ${t("min")(s.duration)}</span></div>`).join("") + `<div style="margin-top:8px"><button class="btn btn-primary btn-sm" id="impApply">${ic("check","sm")}${t("imp_apply")}</button></div>`;
    $("#impApply").onclick = () => { S().biz.services = importResult; save(); toast(t("imp_done"),"check"); render(); };
  }catch(e){ out.innerHTML = ""; say(e && (e.code==="not_granted"||e.code==="sampling_disabled") ? t("imp_off") : t("imp_fail"), "err"); }
}
