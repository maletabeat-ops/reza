async function api(path, opts={}){
  const r = await fetch(path, {credentials:"same-origin", headers:{"content-type":"application/json"}, ...opts, body: opts.body ? JSON.stringify(opts.body) : undefined});
  let j = null; try{ j = await r.json(); }catch(e){}
  if(!r.ok) throw Object.assign(new Error((j && j.error) || "http_"+r.status), {code:(j && j.error) || "http_"+r.status, status:r.status});
  return j;
}
function applyMe(j){
  if(!j || !j.user || !j.doc){ store.user = null; SRV.doc = null; SRV.me = null; return; }
  store.user = j.user; SRV.me = j.business; SRV.doc = j.doc; SRV.ver = j.ver; vk = j.business.sphere;
  SRV.lastIds = new Set(j.doc.items.map(i => i.id)); SRV.alerts = j.doc.alerts.length;
}
async function srvInit(){
  try{
    const r = await fetch("/api/health", {credentials:"same-origin"});
    if(!r.ok || !(r.headers.get("content-type")||"").includes("json")) return;
    SRV.on = true;
    applyMe(await api("/api/me"));
    const igr = new URLSearchParams(location.search).get("ig");
    if(igr){
      history.replaceState(null, "", location.pathname + location.hash);
      setTimeout(() => toast(t({ok:"ig_ok", denied:"ig_denied", unavailable:"ig_unavail"}[igr] || "ig_error"), igr==="ok" ? "check" : "info"), 400);
    }
    setInterval(srvPoll, 12000);
  }catch(e){ SRV.on = false; }
}
function softRefresh(){
  const a = document.activeElement, typing = a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);
  if(route==="inbox" && $("#inbox")) refreshInbox();
  else if(!typing && !ui.cmd && !ui.modal) render();
}
async function srvPoll(){
  if(!SRV.on || !store.user || document.hidden || SRV.timer) return;
  try{
    const j = await api("/api/state");
    if(j.ver !== SRV.ver){
      const before = SRV.alerts;
      SRV.doc = j.doc; SRV.ver = j.ver; SRV.lastIds = new Set(j.doc.items.map(i => i.id)); SRV.alerts = j.doc.alerts.length;
      if(SRV.me) SRV.me.tgLinked = j.tgLinked;
      if(SRV.alerts > before) toast(t("srv_new"), "bell");
      softRefresh();
    }
  }catch(e){ if(e.status === 401){ store.user = null; render(); } }
}
function srvSaveSoon(){
  clearTimeout(SRV.timer);
  SRV.timer = setTimeout(async () => {
    const doc = SRV.doc; if(!doc) { SRV.timer = null; return; }
    const ids = new Set(doc.items.map(i => i.id)), deleted = [...SRV.lastIds].filter(id => !ids.has(id));
    try{
      const j = await api("/api/state", {method:"PUT", body:{doc, deleted}});
      SRV.doc = j.doc; SRV.ver = j.ver; SRV.lastIds = new Set(j.doc.items.map(i => i.id)); SRV.alerts = j.doc.alerts.length;
    }catch(e){ toast(t("err_server"), "info"); }
    SRV.timer = null;
  }, 700);
}

function convertPrices(list, from, to){
  if(from === to) return list;
  return list.map(s => { const p = +s.price || 0; let v = p;
    if(from==="₽" && to==="€") v = p <= 0 ? 0 : p < 500 ? Math.max(1, Math.round(p/85)) : Math.round(p/85/5)*5;
    if(from==="€" && to==="₽") v = Math.round(p*85/50)*50;
    return {...s, price:v}; });
}

  const last = iso(addDays(new Date(), days-1));
  const mp = ui.mp && ui.mp.id===m.id ? ui.mp : null, svc = m.services[mp ? mp.svc : 0];
  const ok = (id) => { const x = (m.team||[]).find(z => z.id===id); return x && (!mp || !mp.staff || mp.staff===id) && (!x.services || !x.services.length || (svc && x.services.includes(svc.name))); };
  return m.free.filter(s => s.date <= last && (!s.staff || s.staff.some(ok)) && !(m.team && m.team.length ? false : (store.cbook||[]).some(b => b.mid===m.id && b.date===s.date && b.time===s.time)));
};
async function loadMasters(){ try{ SRV.masters = (await api("/api/public/masters")).masters; }catch(e){ SRV.masters = []; } }
const _renderFind = renderFind;
renderFind = function(){ if(SRV.on && !SRV.masters){ SRV.masters = []; loadMasters().then(() => { if((location.hash||"").slice(1)==="find") _renderFind(); }); } _renderFind(); };
const _renderMasterPage = renderMasterPage;
renderMasterPage = function(id){
  if(SRV.on && !SRV.masters){ SRV.masters = []; loadMasters().then(() => renderMasterPage(id)); $("#root").innerHTML = ""; return; }
  const m = masters().find(x => x.id===id);
  if(m && m.team && m.team.length && ui.mp && ui.mp.id===id){ // the chosen master must do the chosen service
    const svc = m.services[ui.mp.svc], x = m.team.find(z => z.id===ui.mp.staff);
    if(x && x.services && x.services.length && svc && !x.services.includes(svc.name)) ui.mp.staff = "";
  }
  _renderMasterPage(id);
  if(!m || !m.team || !m.team.length || !ui.mp || ui.mp.done) return;
  const svc = m.services[ui.mp.svc];
  const can = m.team.filter(x => !x.services || !x.services.length || (svc && x.services.includes(svc.name)));
  const pick = `<div class="field"><span>${t("c_master")}</span><div class="seg" style="flex-wrap:wrap;margin-top:6px">${[["",t("any_master")], ...can.map(x => [x.id, x.name])].map(([sid,n]) => `<button type="button" data-act="mStaff" data-s="${esc(sid)}" aria-pressed="${(ui.mp.staff||"")===sid}">${esc(n)}</button>`).join("")}</div></div>`;
  $("#bookCard .sumbox")?.insertAdjacentHTML("afterend", pick);
};
const _doBook = doBook;
doBook = async function(){
  const m = masters().find(x => x.id===ui.mp.id); if(!m || !m.real) return _doBook();
  const mp = ui.mp, isB = m.v==="beauty", svc = m.services[mp.svc];
  const name = $("#cName").value.trim(), phone = $("#cPhone").value.trim(), addr = $("#cAddr")?.value.trim() || "", prob = $("#cProb")?.value.trim() || "";
  let err = "";
  if(isB && (!mp.day || !mp.time)) err = t("c_err_slot"); else if(!isB && (!addr || !prob)) err = t("c_err_addr");
  else if(!name) err = t("c_err_name"); else if(phone.replace(/\D/g,"").length < 6) err = t("c_err_phone");
  const e = $("#cErr"); if(err){ e.textContent = err; e.hidden = false; return; }
  try{
    await api(`/api/public/masters/${encodeURIComponent(m.slug)}/book`, {method:"POST", body:{name, phone, svc:mp.svc, date: mp.time ? mp.day : null, time: mp.time || null, addr, prob, staff: mp.staff || null}});
    (store.cbook ||= []).push({id:uid(), mid:m.id, mname:m.name, v:m.v, service:svc.name, price:svc.price, date: mp.time ? mp.day : null, time: mp.time, ts:Date.now()}); save();
    mp.done = {date: mp.time ? mp.day : null, time: mp.time};
    await loadMasters(); renderMasterPage(m.id);
    $("#bookCard")?.scrollIntoView({behavior:"smooth", block:"start"});
    toast(isB ? t("c_ok_b") : t("c_ok_r"), "check");
  }catch(x){
    if(x.code === "slot_taken"){ await loadMasters(); mp.time = null; renderMasterPage(m.id); const e2 = $("#cErr"); if(e2){ e2.textContent = t("c_err_taken"); e2.hidden = false; } }
    else { e.textContent = t("err_server"); e.hidden = false; }
  }
};

/* real numbers on the dashboard */
const _dash = dashNumbers;
dashNumbers = function(){
  if(!SRV.on || !SRV.doc) return _dash();
  const d = S(), today = iso(new Date()), month = today.slice(0,7);
  const days = Array.from({length:14}, (_,i) => iso(addDays(new Date(), i-13)));
  const daily = days.map(day => d.convos.reduce((a,c) => a + c.msgs.filter(m => m.from==="client" && iso(new Date(m.ts))===day).length, 0));
  const items = d.items.filter(i => i.status !== "cancelled");
  const revenue = items.filter(i => String(i.date||"").slice(0,7)===month).reduce((a,i) => a + (i.price||i.value||0), 0);
  const total = d.convos.length;
  const auto = total ? Math.round(100 * (1 - d.convos.filter(c => c.status==="waiting" || c.human).length / total)) : 0;
  const k = (x) => d.activity.filter(a => x.includes(a.kind)).length, sum = Math.max(1, k(["book","req","reply","handoff"]));
  const pct = (n) => Math.round(n*100/sum);
  return {daily, todayCount: daily[13], handled: total, revenue, auto,
    newCount: isBooking() ? items.filter(i => i.date >= today).length : items.filter(i => i.stage==="new").length,
    active: d.convos.filter(c => c.status !== "done").length,
    cats: [[t("cat1"), pct(k(["book","req"]))], [t("cat2"), pct(k(["reply"]))], [t("cat4"), pct(k(["handoff"]))]]};
};
function srvDraftHTML(c){
  return `<div class="draft"><b><span class="orb"></span>${t("draft_t")}</b><textarea id="draftText" aria-label="draft">${esc(c.draft.reply||"")}</textarea><div class="acts"><button class="btn btn-primary btn-sm" data-act="srvDraftSend">${ic("send","sm")}${t("draft_send")}</button><button class="btn btn-sm" data-act="srvDraftSkip">${t("draft_skip")}</button></div></div>`;
}


/* =====================================================================
   Team (salon mode) and plans
   ===================================================================== */
const fillN = (s, o) => String(s).replace(/\{(\w+)\}/g, (_, k) => o[k]);
const wdShort = (d) => new Intl.DateTimeFormat(loc(), {weekday:"short"}).format(new Date(2026,10,15+d));
function teamOf(){ const d = S(); d.team = d.team || {kind:"solo", staff:[]}; d.team.staff = d.team.staff || []; return d.team; }
const PLANS_C = [{id:"solo", max:1, eur:19, rub:1490},{id:"team", max:5, eur:49, rub:3900},{id:"salon", max:15, eur:99, rub:7900}];
const planNow = () => { const tm = teamOf(), n = tm.kind==="salon" ? Math.max(1, tm.staff.filter(x => x.name && x.active!==false).length) : 1; return PLANS_C.find(p => n <= p.max) || PLANS_C[2]; };
const planPrice = (p) => { const rub = ((SRV.on && SRV.doc) ? SRV.doc.biz.cur : t("cur")) === "₽"; return `${nf(rub ? p.rub : p.eur)} ${rub ? "₽" : "€"}`; };

function pageTeam(){
  const tm = teamOf(), svcs = S().biz.services || [], salon = tm.kind === "salon";
  const seg = `<div class="seg">${[["solo",t("tm_solo")],["salon",t("tm_salon")]].map(([k,l]) => `<button data-act="teamKind" data-k="${k}" aria-pressed="${tm.kind===k}">${esc(l)}</button>`).join("")}</div>`;
  if(!salon) return `<div class="page">${pageHead(t("tm_t"), t("tm_sub"), seg)}
    <section class="card card-pad" style="display:grid;gap:12px;max-width:640px"><h3>${t("tm_solo_h")}</h3><p class="muted">${t("tm_solo_p")}</p>
      <button class="btn btn-primary" style="justify-self:start" data-act="teamKind" data-k="salon">${ic("users","sm")}${t("tm_switch")}</button></section></div>`;
  const p = planNow();
  const card = (x, i) => `<article class="card card-pad tm-card" style="display:grid;gap:12px;${x.active===false?"opacity:.6":""}">
      <div style="display:flex;gap:10px;align-items:center">${avatar(x.name||"?")}
        <div style="flex:1;min-width:0;display:grid;gap:6px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">
          <label class="field"><span>${t("tm_name")}</span><input class="input" data-tm="name" data-i="${i}" value="${esc(x.name)}" id="tmName${i}"></label>
          <label class="field"><span>${t("tm_role")}</span><input class="input" data-tm="role" data-i="${i}" value="${esc(x.role||"")}" placeholder="${esc(t("tm_role_ph"))}" id="tmRole${i}"></label>
        </div></div>
      <div><div class="field"><span>${t("tm_svcs")}</span></div><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">${svcs.map(sv => `<button class="pill ${(x.services||[]).includes(sv.name)?"ai":"line"}" style="cursor:pointer" data-act="tmSvc" data-i="${i}" data-s="${esc(sv.name)}">${esc(sv.name)}</button>`).join("")}</div><small class="muted">${t("tm_svcs_p")}</small></div>
      <div><div class="field"><span>${t("tm_off")}</span></div><div class="seg" style="flex-wrap:wrap;margin-top:6px">${[1,2,3,4,5,6,0].map(d => `<button data-act="tmOff" data-i="${i}" data-d="${d}" aria-pressed="${(x.off||[]).includes(d)}">${esc(wdShort(d))}</button>`).join("")}</div></div>
      <div style="display:flex;justify-content:flex-end"><button class="btn btn-sm btn-ghost" data-act="tmDel" data-i="${i}" style="color:var(--hot)">${ic("x","sm")}${t("tm_del")}</button></div>
    </article>`;
  return `<div class="page">${pageHead(t("tm_t"), t("tm_sub"), seg)}
    <section class="dark-card" style="display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;padding:20px 22px">
      <div><span class="eyebrow" style="color:var(--accent-2)">${t("pl_t")}</span><h3 style="margin-top:4px">${esc(t("pl_names")[p.id])} · ${planPrice(p)}${t("pl_per")}</h3><small style="color:var(--on-dark-2)">${fillN(t("pl_staff"),{n:tm.staff.filter(x=>x.name).length})} · ${t("pl_auto")}</small></div>
      <button class="btn btn-primary" data-act="tmAdd" ${tm.staff.length>=15?"disabled":""}>${ic("plus","sm")}${t("tm_add")}</button></section>
    <div style="display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))">${tm.staff.map(card).join("")}</div>
    ${tm.staff.length>=15?`<p class="muted">${t("tm_max")}</p>`:""}</div>`;
}
Object.assign(ACT, {
  teamKind(el){ const tm = teamOf(); tm.kind = el.dataset.k;
    if(tm.kind==="salon" && !tm.staff.length) tm.staff.push({id:uid(), name:(SRV.on && store.user ? store.user.name : S().biz.owner) || "", role:"", services:[], off:[], active:true});
    save(); render(); },
  tmAdd(){ const tm = teamOf(); if(tm.staff.length >= 15) return; tm.staff.push({id:uid(), name:"", role:"", services:[], off:[], active:true}); save(); render();
    setTimeout(() => { const f = $(`#tmName${tm.staff.length-1}`); f?.focus(); f?.scrollIntoView({block:"center", behavior:"smooth"}); }, 50); },
  tmDel(el){ const tm = teamOf(); tm.staff.splice(+el.dataset.i, 1); save(); render(); },
  tmSvc(el){ const x = teamOf().staff[+el.dataset.i]; const n = el.dataset.s; x.services = (x.services||[]).includes(n) ? x.services.filter(v => v!==n) : [...(x.services||[]), n]; save(); render(); },
  tmOff(el){ const x = teamOf().staff[+el.dataset.i]; const d = +el.dataset.d; x.off = (x.off||[]).includes(d) ? x.off.filter(v => v!==d) : [...(x.off||[]), d]; save(); render(); },
  staffF(el){ ui.staffF = el.dataset.s || ""; render(); },
  auTeam(el){ ui.auTeam = el.dataset.k; $$("[data-act='auTeam']").forEach(b => b.setAttribute("aria-pressed", String(b===el))); },
  mStaff(el){ ui.mp.staff = el.dataset.s || ""; ui.mp.time = null; keepForm(() => renderMasterPage(ui.mp.id)); },
});
document.addEventListener("change", e => {
  const f = e.target.closest("[data-tm]"); if(!f) return;
  const x = teamOf().staff[+f.dataset.i]; if(!x) return;
  x[f.dataset.tm] = f.value.trim().slice(0, 40); save();
  if(f.dataset.tm === "name") render();
});

/* pages registry: the team page */
const _pageFor = renderShell;
renderShell = function(){
  if(route === "team" && !isBooking()) route = "dashboard";
  _pageFor();
};
const _pageProfile = pageProfile;
pageProfile = function(){
  const html = _pageProfile();
  if(!SRV.on || !SRV.me) return html;
  const cur = planNow(), pl = SRV.me.plan || {}, left = Math.ceil(((pl.trialEnds||Date.now()) - Date.now()) / 864e5);
  const card = `<section class="dark-card plan" style="display:grid;gap:14px">
    <div class="eyebrow" style="color:var(--accent-2)">${t("pl_t")}</div>
    <div style="font-size:40px;font-weight:800;letter-spacing:-.04em">${esc(t("pl_names")[cur.id])} <small style="font-size:15px;color:var(--on-dark-2);font-weight:600">${planPrice(cur)}${t("pl_per")}</small></div>
    ${pl.paid ? "" : `<div style="display:grid;gap:6px"><div style="display:flex;justify-content:space-between;font-size:13px;color:var(--on-dark-2)"><span>${left > 0 ? fillN(t("pl_trial"),{d:left}) : t("pl_trial_end")}</span><span>${Math.max(0,left)}/30</span></div><div class="meter"><i style="width:${Math.max(0,Math.min(100,(30-left)/30*100)).toFixed(0)}%"></i></div></div>`}
    <div style="display:grid;gap:6px">${PLANS_C.map(p => `<div style="display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:6px 0;border-top:1px solid rgba(255,255,255,.08)"><span><b>${esc(t("pl_names")[p.id])}</b> <span style="color:var(--on-dark-2)">· ${p.max===1 ? t("pl_one") : fillN(t("pl_max"),{n:p.max})}</span></span><span class="num">${planPrice(p)}${p.id===cur.id?` <span class="pill ok" style="margin-left:6px">${t("pl_now")}</span>`:""}</span></div>`).join("")}</div>
    <small style="color:var(--on-dark-2)">${t("pl_auto")} ${t("pl_soon")}</small>
    ${isBooking() ? `<button class="btn btn-primary" data-act="go" data-r="team" style="justify-self:start">${ic("users","sm")}${t("n_team")}${ic("right","sm")}</button>` : ""}
  </section>`;
  return html.replace(/<section class="dark-card plan">[\s\S]*?<\/section>/, card).replace('<span class="pill ai">Pro</span>', `<span class="pill ai">${esc(t("pl_names")[cur.id])}</span>`);
};


/* =====================================================================
   Install on the phone (PWA): Android gets the browser prompt, iPhone gets the steps
   ===================================================================== */
const INST = {evt:null};
const isStandalone = () => { try{ return matchMedia("(display-mode: standalone)").matches || navigator.standalone === true; }catch(e){ return false; } };
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const inAppBrowser = () => /Instagram|FBAN|FBAV|Telegram|Line\//i.test(navigator.userAgent);
function installable(){ return !isStandalone(); }
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); INST.evt = e; });
window.addEventListener("appinstalled", () => { INST.evt = null; toast(t("in_ok"), "check"); render(); });
if("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("/sw.js").catch(() => {});
function installDialog(){
  const steps = isIOS() ? t("in_ios") : t("in_and");
  $("#instOv")?.remove();
  document.body.insertAdjacentHTML("beforeend", `<div id="instOv" class="inst-ov" role="dialog" aria-modal="true" aria-labelledby="instT" onclick="if(event.target===this)this.remove()">
    <div class="card inst-box">
      <div style="display:flex;gap:14px;align-items:center">${appIconSVG(56)}<div><h3 id="instT" style="font-size:19px">${t("in_t")}</h3><p class="muted" style="font-size:14px;margin-top:4px">${t("in_p")}</p></div></div>
      ${isIOS() && inAppBrowser() ? `<p class="hint-line">${ic("info","sm")}<span>${t("in_ios_safari")}</span></p>` : ""}
      <ol class="isteps">${steps.map((x,i) => `<li class="ist"><span class="n">${i+1}</span><div><b>${esc(x)}</b></div></li>`).join("")}</ol>
      <button class="btn btn-primary" data-act="instClose" style="justify-self:end">${t("in_close")}</button>
    </div></div>`);
}
Object.assign(ACT, {
  async install(){
    if(INST.evt){ const e = INST.evt; INST.evt = null; e.prompt(); try{ await e.userChoice; }catch(x){} render(); return; }
    installDialog();
  },
  instClose(){ $("#instOv")?.remove(); },
  instLater(){ store.prefs.instHide = Date.now(); save(); $("#instBanner")?.remove(); },
});
/* a small banner on the dashboard until the app is installed (hidden for 14 days after "Later") */
const _pageDashboard = pageDashboard;
pageDashboard = function(){
  const html = _pageDashboard();
  const hidden = store.prefs.instHide && Date.now() - store.prefs.instHide < 14 * 864e5;
  if(!installable() || hidden) return html;
  const banner = `<section class="card card-pad" id="instBanner" style="display:flex;flex-wrap:wrap;gap:12px;align-items:center">${appIconSVG(44)}<p style="flex:1;min-width:200px;margin:0">${t("in_banner")}</p>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-left:auto"><button class="btn btn-sm btn-ghost" data-act="instLater">${t("in_later")}</button><button class="btn btn-sm btn-primary" data-act="install">${ic("phone","sm")}${t("in_short")}</button></div></section>`;
  return html.replace('<div class="page">', '<div class="page">' + banner);
};

/* =====================================================================
   Boot
   ===================================================================== */
setTimeout(() => $("#boot").classList.add("done"), 650);
load(); applyTheme(); srvInit().finally(render);
</script>
